---
# --------------------------------

- name: "Include variables wrapper"
  ansible.builtin.include_tasks:
    file: variables.yml
  tags: ["ct-kafka"]

- name: "Disto/Family tasks (FF)"
  ansible.builtin.include_tasks:
    file: "{{ lookup('ansible.builtin.first_found', params) }}"
  vars:
    params:
      files:
      - "{{ ansible_facts['distribution'] }}-{{ ansible_facts['distribution_major_version'].split('.')[0] }}.yml"
      - "{{ ansible_facts['distribution'] }}.yml"
      - "{{ ansible_facts['os_family'] }}.yml"
      - "default.yml"
  tags: ["ct-kafka"]

- name: "Kafka group"
  ansible.builtin.group:
    name: "{{ kafka_user }}"
    state: present
  become: true
  tags: ["ct-kafka"]

- name: "Kafka user"
  ansible.builtin.user:
    group: "{{ kafka_user }}"
    name: "{{ kafka_user }}"
    state: present
  become: true
  tags: ["ct-kafka"]

- name: "Create Kafka staging dir"
  ansible.builtin.file:
    path: "{{ kafka_staging_dir }}"
    mode: "0755"
    state: directory
  tags: ["ct-kafka"]

- name: "Create Kafka install dir"
  ansible.builtin.file:
    path: "{{ kafka_install_dir }}"
    mode: "0755"
    state: directory
  become: true
  tags: ["ct-kafka"]

- name: "Create Kafka logs dir"
  ansible.builtin.file:
    path: "{{ kafka_logs_dir }}"
    mode: "0755"
    owner: "{{ kafka_user }}"
    group: "{{ kafka_user }}"
    state: directory
  become: true
  tags: ["ct-kafka"]

- name: "Download Kafka archive"
  ansible.builtin.get_url:
    dest: "{{ kafka_staging_dir }}/{{ kafka_tarball }}"
    mode: "0644"
    timeout: "{{ kafka_internet_timeout }}"
    url: "{{ kafka_url }}"
    validate_certs: false
  tags: ["ct-kafka"]

- name: "Expand Kafka archive"
  ansible.builtin.unarchive:
    copy: false
    creates: "{{ kafka_config_dir }}/server.properties"
    dest: "{{ kafka_install_dir }}"
    extra_opts: ["--strip-components=1"]
    src: "{{ kafka_staging_dir }}/{{ kafka_tarball }}"
  become: true
  ignore_errors: "{{ ansible_check_mode }}"
  tags: ["ct-kafka"]

- name: "Update /etc/hosts with internal IP"
  ansible.builtin.lineinfile:
    line: "{{ local_ipv4 }} {{ inventory_hostname }}"
    path: /etc/hosts
    regexp: '\d+\.\d+\.\d+\.\d+ {{ inventory_hostname }}'
    state: present
  become: true
  tags: ["ct-kafka"]

# BLOCK_START
- name: "Block: full install"
  when: kafka_full_install
  tags: ["ct-kafka"]
  block:
  - name: "Render Kafka config file"
    ansible.builtin.template:
      src: server.properties.j2
      dest: "{{ kafka_config_dir }}/server.properties"
      mode: "0644"
    notify: HandlerRestartKafka
    become: true
    tags: ["ct-kafka"]

  - name: "Render Systemd unit file"
    ansible.builtin.template:
      src: kafka.service.j2
      dest: /etc/systemd/system/kafka.service
      owner: root
      group: root
      mode: "0600"
    register: reg_service
    become: true
    tags: ["ct-kafka"]

  - name: "Enable Kafka service"
    ansible.builtin.systemd:
      name: kafka
      state: "{{ kafka_svc_state }}"
      enabled: "{{ kafka_svc_enabled }}"
      daemon_reload: "{{ reg_service is changed }}"
    become: true
    tags: ["ct-kafka"]
# BLOCK_END

# --------------------------------
...
